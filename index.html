<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#170e32">
<title>The Universe of You — A little world for Banshika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff8ff;--muted:#d8c9ed;--pink:#ff9ccf;--violet:#b9a0ff;--deep:#170e32;--glass:rgba(31,20,61,.72)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--deep);color:var(--ink);font-family:"DM Sans",sans-serif}
body{overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#543278 0%,#24143f 45%,#100b25 100%)}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(13,8,30,.1),rgba(13,8,30,.55))}
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(18px,4vw,54px);gap:16px}
.brand{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#f2dfff}
.progress-wrap{display:flex;align-items:center;gap:10px;color:#e6d7fa;font-size:.8rem}
.progress{width:120px;height:6px;border-radius:10px;background:#ffffff24;overflow:hidden}.progress>i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet));transition:width .5s}
main{width:min(100% - 32px,900px);margin:auto;display:flex;align-items:center;justify-content:center;flex:1;padding:22px 0 54px}
.panel{width:min(100%,700px);padding:clamp(24px,5vw,48px);border:1px solid #ffffff25;border-radius:28px;background:linear-gradient(145deg,rgba(50,32,83,.78),rgba(22,15,47,.82));box-shadow:0 24px 90px #08051488,inset 0 1px #ffffff20;backdrop-filter:blur(16px);text-align:center;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.eyebrow{color:var(--pink);letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;font-weight:700}
h1,h2{font-family:"Playfair Display",serif;font-weight:600;line-height:1.1;margin:14px 0}
h1{font-size:clamp(2.6rem,8vw,5.2rem);background:linear-gradient(110deg,#fff,#ffd2ed 48%,#c7b5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(2rem,5vw,3.3rem)}
p{color:var(--muted);font-size:1.04rem;line-height:1.75;margin:12px auto;max-width:570px}
.sub{font-size:.9rem;color:#c5b4df}
.btn{border:0;border-radius:999px;padding:14px 24px;margin:10px 5px 0;cursor:pointer;font:700 .95rem "DM Sans";color:#281638;background:linear-gradient(100deg,#ffb1d9,#d0baff);box-shadow:0 8px 30px #e99bd944;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}.btn.secondary{background:#ffffff12;color:#fff;border:1px solid #ffffff35;box-shadow:none}
.big-heart{font-size:4.2rem;filter:drop-shadow(0 0 22px #ff8ecb);animation:beat 1.5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.heart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px auto;max-width:470px}
.heart{min-height:100px;border:1px solid #ffffff25;border-radius:18px;background:#ffffff0c;color:white;font-size:2rem;cursor:pointer;transition:.2s}
.heart:hover{background:#ff9ccf22;transform:translateY(-3px)}.heart.found{background:#ff9ccf24;border-color:#ffacd7;color:#ffc2e1}
.note{padding:17px 18px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff20;margin:18px auto;max-width:540px;color:#ffe5f4;line-height:1.65}
.memory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px auto;max-width:490px}
.memory{min-height:100px;border-radius:17px;border:1px solid #ffffff28;background:linear-gradient(135deg,#ffffff16,#ffffff08);color:#fff;font-weight:600;font-size:1rem;cursor:pointer;padding:14px}
.memory.revealed{background:linear-gradient(135deg,#ffadd533,#bca8ff33);border-color:#f7c1e6}
.riddle{font-family:"Playfair Display",serif;font-size:1.35rem;color:#fff;margin:22px auto}
.answer{display:block;width:min(100%,400px);margin:10px auto;padding:13px;border:1px solid #ffffff30;border-radius:14px;background:#ffffff0d;color:white;cursor:pointer;font:500 1rem "DM Sans"}
.answer:hover{background:#ffffff20}
.letter{text-align:left;background:#fff8f2;color:#563e59;border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 15px 45px #0004;max-height:52vh;overflow:auto}
.letter p{color:#624a65;font-family:"Playfair Display",serif;font-size:1.05rem;line-height:1.85}
.signature{font-family:"Playfair Display",serif;color:#a44e85!important;font-size:1.5rem!important;text-align:right;margin-top:24px}
.footer{text-align:center;color:#bcaed1;font-size:.75rem;padding:0 15px 18px}
.upload{display:inline-block;margin-top:12px;font-size:.85rem;color:#e8d9ff;cursor:pointer;text-decoration:underline}
input[type=file]{display:none}.small{font-size:.82rem;color:#bdaed4}
@media(max-width:520px){.topbar{padding:15px}.progress{width:72px}.heart-grid{gap:8px}.heart{min-height:82px}.panel{border-radius:22px}.memory-grid{gap:8px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="app">
  <header class="topbar"><div class="brand">✦ A world made for Banshika</div><div class="progress-wrap"><span id="stepLabel">Prologue</span><span class="progress"><i id="progressBar"></i></span></div></header>
  <main><section class="panel" id="panel" aria-live="polite"></section></main>
  <footer class="footer">A little universe, made with care by Durga · Play with sound on for the full experience</footer>
</div>
<audio id="music" loop></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const panel=$("#panel"), music=$("#music");
let stage=0, heartsFound=0, revealed=0, matched=0, firstCard=null, lock=false;
const heartNotes=[
"Because you have a way of making ordinary days feel a little brighter.",
"Because your kindness shows up in the smallest, sweetest ways.",
"Because even a tiny reel from you can turn a day around.",
"Because you make people feel remembered, included, and special.",
"Because your laughter deserves its own constellation.",
"Because the world is genuinely lovelier with you in it."
];
const memories=[
{front:"🌷 A little reminder",back:"You don't have to do anything extraordinary to be appreciated. Being you is already enough."},
{front:"✨ Your superpower",back:"You make small moments feel like memories worth keeping."},
{front:"🎁 The thoughtful one",back:"The little gifts and reels you send never feel little. They say, 'I thought of you.'"},
{front:"🌙 A promise",back:"On days when you forget your sparkle, I hope this little world reminds you it's still there."}
];
function shell(eyebrow,title,body,buttons=""){panel.innerHTML=`<div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${body}${buttons}`}
function updateProgress(){const labels=["Prologue","The Heart Collector","Memory Garden","The Little Puzzle","The Final Star"];$("#stepLabel").textContent=labels[Math.min(stage,4)];$("#progressBar").style.width=(stage/4*100)+"%"}
function go(next){stage=next;updateProgress();panel.style.animation="none";void panel.offsetWidth;panel.style.animation="";render()}
function render(){
 if(stage===0){shell("A message from somewhere magical","THE UNIVERSE<br>OF YOU",`<div class="big-heart">♡</div><p>Somewhere beyond the stars, a tiny universe has been waiting for one person to arrive.</p><p class="sub">And that person is you, Banshika.</p><p>Ready to find out why this world exists?</p>`,`<button class="btn" onclick="startGame()">Enter your universe ✨</button><p class="small">Best experienced with headphones · Works on mobile and desktop</p>`)}
 if(stage===1){shell("Level 1 · The Heart Collector","Collect the little reminders",`<p>Six glowing hearts are scattered through this universe. Tap each one to discover a little reason you are appreciated.</p><div class="heart-grid">${heartNotes.map((n,i)=>`<button class="heart ${window.found?.includes(i)?'found':''}" onclick="findHeart(${i})" aria-label="Find heart ${i+1}">${window.found?.includes(i)?'♥':'♡'}</button>`).join("")}</div><div id="heartNote" class="note">${heartsFound===0?"Find all six hearts. Each one carries a message.":`${heartsFound} of 6 hearts found. Keep going, explorer.`}</div>`,`<button class="btn" id="nextHeart" ${heartsFound<6?'disabled style="opacity:.4;cursor:not-allowed"':''} onclick="go(2)">Enter the Memory Garden →</button>`)}
 if(stage===2){shell("Level 2 · The Memory Garden","Some things deserve to bloom",`<p>Turn over each little flower. There are no scores here—only reminders you can keep.</p><div class="memory-grid">${memories.map((m,i)=>`<button class="memory ${window.memFound?.includes(i)?'revealed':''}" onclick="revealMemory(${i})">${window.memFound?.includes(i)?m.back:m.front}</button>`).join("")}</div><div class="small">${revealed} of 4 flowers opened</div>`,`<button class="btn" ${revealed<4?'disabled style="opacity:.4;cursor:not-allowed"':''} onclick="go(3)">Follow the starlight →</button>`)}
 if(stage===3){shell("Level 3 · A tiny friendship puzzle","One last little secret",`<p>Choose the answer that feels most true. (There is no wrong way to be yourself.)</p><div class="riddle">What makes a person unforgettable?</div><button class="answer" onclick="puzzleAnswer(0)">A. Perfect words and grand gestures</button><button class="answer" onclick="puzzleAnswer(1)">B. The way they make you feel seen</button><button class="answer" onclick="puzzleAnswer(2)">C. Never making a single mistake</button><div id="puzzleReply" class="small"></div>`,`<button class="btn" id="finalBtn" style="display:none" onclick="go(4)">Open the final star ✨</button>`)}
 if(stage===4){shell("Final level · A letter from Durga","You were the whole point",`<div class="big-heart">💗</div><div class="letter"><p>Dear Banshika,</p><p>If you've made it this far, I hope you've realised that this little universe was never really about collecting hearts, opening flowers, or solving puzzles.</p><p>It was about you.</p><p>You have this lovely habit of making people feel special in ways you might not even notice. The reels, the little gifts, the random moments of thoughtfulness—they all mean more than I can properly explain.</p><p>I wanted to make something that gives a little of that feeling back to you. A place where you are the main character, where every star is cheering for you, and where you never have to wonder whether you matter.</p><p>Thank you for being you, Banshika. Keep being your bright, kind, wonderfully one-of-a-kind self. And whenever the world feels a little heavy, remember: somewhere, someone is grateful that their universe includes you.</p><p class="signature">With lots of love,<br>Durga ♡</p></div><p>One last thing… let the stars have their song.</p><label class="upload">＋ Add the song “Dilruba Dilkashi” from your device<input id="songFile" type="file" accept="audio/*" onchange="loadSong(event)"></label><div id="musicStatus" class="small">Your audio file stays on your device; it is not uploaded anywhere.</div>`,`<button class="btn" onclick="celebrate()">Make a wish ✨</button><button class="btn secondary" onclick="location.reload()">Play again</button>`)}
}
window.found=[];window.memFound=[];
function startGame(){if(music.src)music.play().catch(()=>{});go(1)}
function findHeart(i){if(window.found.includes(i))return;window.found.push(i);heartsFound++;$("#heartNote").textContent=heartNotes[i];$("#heartNote").classList.remove("note");void $("#heartNote").offsetWidth;$("#heartNote").classList.add("note");renderHeartButtons()}
function renderHeartButtons(){document.querySelectorAll(".heart").forEach((b,i)=>{if(window.found.includes(i)){b.classList.add("found");b.textContent="♥"}});$("#heartNote").textContent=heartNotes[window.found[window.found.length-1]];if(heartsFound===6){$("#nextHeart").disabled=false;$("#nextHeart").style.opacity=1;$("#nextHeart").style.cursor="pointer";$("#heartNote").textContent="All six hearts found. You were always the treasure. ♡"}}
function revealMemory(i){if(window.memFound.includes(i))return;window.memFound.push(i);revealed++;render()}
function puzzleAnswer(i){const r=$("#puzzleReply");if(i===1){r.textContent="Exactly. And Banshika, you have a gift for making people feel that way. ♡";$("#finalBtn").style.display="inline-block"}else{r.textContent="Try once more. Think about the feeling someone leaves behind."}}
function loadSong(e){const file=e.target.files[0];if(!file)return;music.src=URL.createObjectURL(file);music.play().then(()=>$("#musicStatus").textContent="Now playing: "+file.name).catch(()=>$("#musicStatus").textContent="Song loaded. Tap the music controls or try again.");}
function celebrate(){for(let i=0;i<36;i++){const el=document.createElement("div");el.textContent=["✦","♡","✧","💗"][i%4];el.style.cssText=`position:fixed;z-index:10;left:${Math.random()*100}vw;top:${70+Math.random()*25}vh;font-size:${18+Math.random()*25}px;pointer-events:none;animation:rise 2.4s ease-out forwards;color:${i%2?"#ffc3e5":"#d4c6ff"}`;document.body.append(el);setTimeout(()=>el.remove(),2500)}$("#panel").insertAdjacentHTML("beforeend",'<p class="sub">The universe is a little brighter because you are in it. 🌟</p>')}
render();updateProgress();

// Ambient 3D starfield and floating crystal; gracefully falls back if WebGL is unavailable.
(function(){
 const canvas=$("#scene");
 if(!window.THREE){canvas.style.display="none";return}
 try{
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
  const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(0,1.3,8);
  scene.add(new THREE.AmbientLight(0xb9a2ff,1.4));const light=new THREE.PointLight(0xff9ed4,3,30);light.position.set(2,3,4);scene.add(light);
  const gem=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,1),new THREE.MeshStandardMaterial({color:0xdca8ff,metalness:.42,roughness:.2,transparent:true,opacity:.72,emissive:0x5a1c78,emissiveIntensity:.5}));gem.position.set(2.8,.3,-2);scene.add(gem);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.018,8,100),new THREE.MeshBasicMaterial({color:0xffb8e3,transparent:true,opacity:.7}));ring.position.copy(gem.position);ring.rotation.x=1.1;scene.add(ring);
  const count=850,positions=new Float32Array(count*3);for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*24;positions[i*3+1]=(Math.random()-.5)*15;positions[i*3+2]=(Math.random()-.5)*22-3}
  const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(positions,3));const stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffdff3,size:.035,transparent:true,opacity:.85}));scene.add(stars);
  let t=0;function animate(){requestAnimationFrame(animate);t+=.006;gem.rotation.y+=.003;gem.rotation.x+=.0015;gem.position.y=.3+Math.sin(t)*.22;ring.rotation.z+=.002;stars.rotation.y=Math.sin(t*.3)*.025;renderer.render(scene,camera)}animate();
  addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 }catch(e){canvas.style.display="none"}
})();
</script>
</body>
</html>
